name: UI stack prototype
on:
  push:
    branches: [master]
    paths:
      - 'prototypes/ionic-battle/**'
      - '.github/workflows/ui-stack-prototype.yml'
  pull_request:
    paths:
      - 'prototypes/ionic-battle/**'
      - '.github/workflows/ui-stack-prototype.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/ionic-battle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: prototypes/ionic-battle/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run probe:engine
      - run: npm run build
